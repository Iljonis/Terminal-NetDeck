# BORRADOR (paso P5 de windows/PLAN.md): no está activo. Para activarlo, revisa las versiones marcadas con «REVISAR»
# y cópialo a .github/workflows/windows.yml. Compila el núcleo (NetDeckCore) en Windows; los tests, desde el paso P6.
name: Windows (núcleo)

on:
  pull_request:
    branches: [propuesta/windows]
  push:
    branches: [propuesta/windows]

permissions:
  contents: read

jobs:
  nucleo:
    runs-on: windows-latest
    # Mientras dure el paso P4 no se pone en rojo el PR: se quita cuando el núcleo compile entero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain de Swift para Windows
        # REVISAR: acción y versión. compnerd/gha-setup-swift es la que usa el propio proyecto Swift para Windows;
        # fija un tag o un commit concreto, nunca @main.
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release   # REVISAR
          tag: 6.2-RELEASE            # REVISAR
      - name: Versión
        run: swift --version
      - name: Privacidad (nada personal en el repositorio)
        shell: bash
        run: tools/privacidad.sh
      - name: Compilar el núcleo
        run: swift build --target NetDeckCore 2>&1 | Tee-Object compilacion.txt
      - name: Guardar el resultado
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compilacion-windows
          path: compilacion.txt
