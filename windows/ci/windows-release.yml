# BORRADOR (P10 de windows/PLAN.md): no está activo. Para activarlo, cópialo a .github/workflows/windows-release.yml (esa carpeta la gestiona
# Codex; este archivo vive aquí, igual que windows-nucleo.yml, para no tocarla desde otra sesión). Revisa lo marcado con «REVISAR».
#
# Qué hace: con un tag «vX.Y.Z-windows» (o a mano, con «Run workflow») compila la app WinUI en Release, prepara la carpeta del instalador,
# compila el .msi con WiX 4 y, con tag, lo sube a una Release de GitHub con las notas de windows/CHANGELOG.md.
#
# SIN FIRMA: no hay certificado todavía. El .msi sale sin firmar y el actualizador de la app lo rechazará (a menos que se use
# NETDECK_UPDATE_ALLOW_UNSIGNED=1 en pruebas). No hace falta ninguna variable «SKIP_AUTHENTICODE_CHECK»: nada la lee, y no hay paso de firma.
# Cuando exista el certificado, la firma (signtool o Azure Trusted Signing) va entre «Compilar el .msi» y «Notas».
#
# REVISAR (decisión del autor): el actualizador de Windows pregunta por `releases/latest` y la de macOS (release.yml) también y espera el
# .dmg ahí. Una Release aparte «vX.Y.Z-windows» marcada como prerelease NO pisa a la de macOS, pero tampoco la ve el actualizador de Windows:
# habría que cambiar UpdateChecker para listar las releases y coger la última con un .msi, o subir el .msi a la misma Release que el .dmg.
name: Windows Release

on:
  push:
    tags: ['v*-windows']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # La misma versión que windows.yml y que espera windows/scripts/test.ps1 (…\Toolchains\6.4.2+Asserts).
  SWIFT_VERSION: swift-6.4.2-release
  SWIFT_BUILD: 6.4.2-RELEASE
  WIX_VERSION: 4.0.6

jobs:
  release:
    name: Instalador de Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Sin conversión de fin de línea
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Toolchain de Swift para Windows
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-build: ${{ env.SWIFT_BUILD }}
      - name: Privacidad (nada personal en el repositorio)
        shell: bash
        run: bash tools/privacidad.sh

      - name: Tests del núcleo
        # REVISAR: sin «continue-on-error» cuando se arreglen los fallos intermitentes de permisos de archivos temporales (windows/ESTADO.md, P6).
        continue-on-error: true
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/scripts/test.ps1

      - name: La versión del tag, del manifiesto, del instalador y del actualizador es la misma
        id: version
        shell: pwsh
        run: |
          $wxs = [regex]::Match((Get-Content -Raw windows/installer/NetDeckWindows.wxs), '<\?define Version = "([^"]+)"\?>').Groups[1].Value
          $appx = [regex]::Match((Get-Content -Raw windows/Desktop/AppxManifest.xml), 'Version="(\d+\.\d+\.\d+)\.0"').Groups[1].Value
          $swift = [regex]::Match((Get-Content -Raw Sources/NetDeckCore/Update/UpdateChecker.swift), 'currentVersion = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)-windows$') { throw "El tag $env:GITHUB_REF_NAME no es vX.Y.Z-windows" }
            $version = $Matches[1]
          } else { $version = $wxs }            # (a mano: la del instalador)
          foreach ($par in @(@('NetDeckWindows.wxs', $wxs), @('AppxManifest.xml', $appx), @('UpdateChecker.currentVersion', $swift))) {
            if ($par[1] -ne $version) { throw "$($par[0]) dice '$($par[1])' y la versión es ${version}: cámbialas a la vez" }
          }
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Compilar la app en Release
        # Lo mismo que el build local (windows/scripts/desktop.ps1): resuelve con --force-resolved-versions, copia el bootstrapper de Windows App SDK y
        # usa -DOPENSSL_NO_ASM. No hace falta el DDLM del Windows App Runtime para COMPILAR (sólo para ejecutar la app, y aquí no se ejecuta).
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/scripts/desktop.ps1 -Configuration release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: WiX 4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.dotnet/tools')

      - name: Preparar la carpeta del instalador
        shell: pwsh
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/preparar-instalador.ps1 -Configuracion release -Destino (Join-Path $carpeta 'files')

      - name: Compilar el .msi
        id: msi
        shell: pwsh
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          $msi = Join-Path $carpeta "Terminal-NetDeck-${{ steps.version.outputs.version }}.msi"
          wix build windows/installer/NetDeckWindows.wxs (Join-Path $carpeta 'archivos.wxs') -arch x64 -d "SourceDir=$(Join-Path $carpeta 'files')" -d "Version=${{ steps.version.outputs.version }}" -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix msi validate $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLower()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content -Encoding ASCII "$msi.sha256"
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "msi=$msi"

      - name: Notas de esta versión (windows/CHANGELOG.md)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $texto = Get-Content -Raw -Encoding UTF8 windows/CHANGELOG.md
          $m = [regex]::Match($texto, "(?ms)^## $([regex]::Escape($version))\b.*?(?=^## |\z)")
          if (-not $m.Success) { throw "windows/CHANGELOG.md no tiene una sección ## $version" }
          $m.Value.Trim() | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'notas.md')

      - name: Guardar el instalador (también en las pruebas a mano)
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: |
            ${{ steps.msi.outputs.msi }}
            ${{ steps.msi.outputs.msi }}.sha256
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Terminal NetDeck para Windows ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notas.md
          files: |
            ${{ steps.msi.outputs.msi }}
            ${{ steps.msi.outputs.msi }}.sha256
          # Sin firma y sin release pública todavía: prerelease, y que no sea «la última» (la de macOS manda en releases/latest).
          prerelease: true
          make_latest: false
