# BORRADOR (P10 de windows/PLAN.md): no está activo. Para activarlo, cópialo a .github/workflows/windows-release.yml (esa carpeta la gestiona
# Codex; este archivo vive aquí, igual que el borrador anterior de la CI del núcleo (hoy en .github/workflows/windows.yml), para no tocarla desde otra sesión). Revisa lo marcado con «REVISAR».
#
# Qué hace: con un tag «vX.Y.Z» (el MISMO tag que la Release de macOS, release.yml) compila la app WinUI en Release, prepara la carpeta del instalador, compila el .msi con
# WiX 4 y lo SUBE a la Release de ese tag, junto al .dmg. A mano («Run workflow») hace lo mismo sin subir nada: deja el .msi como artefacto.
#
# DECISION DEL AUTOR: el .msi va en la misma Release que el .dmg y el actualizador de Windows sigue usando `releases/latest` (sin cambios en UpdateChecker). Por eso la versión de Windows es la del repositorio:
# el paso «La versión del tag…» exige que el tag, NetDeckWindows.wxs, AppxManifest.xml y UpdateChecker.currentVersion digan lo mismo, así que al preparar una release hay que subir las cuatro a la vez (como install.sh en macOS).
#
# ESTE JOB NO CREA LA RELEASE, SÓLO LE SUBE EL .msi: release.yml termina con `gh release create «tag»`, que FALLA si la Release ya existe. Si el job de Windows la creara antes (con softprops/action-gh-release
# o gh release create), se rompería la release de macOS. Por eso espera a que macOS la cree (hasta 60 minutos) y entonces hace `gh release upload`.
#
# ACTIVACIÓN: el job sólo corre en los tags si la variable del repositorio WINDOWS_RELEASE vale «true»; mientras no, un tag de sólo-macOS no lo dispara (y no se pone en rojo por una versión de Windows que no toca).
#
# SIN FIRMA: no hay certificado todavía. El .msi sale sin firmar y el actualizador de la app lo rechazará (a menos que se use NETDECK_UPDATE_ALLOW_UNSIGNED=1 en pruebas). No hace falta ninguna variable
# «SKIP_AUTHENTICODE_CHECK»: nada la lee, y no hay paso de firma. Cuando exista el certificado, la firma (signtool o Azure Trusted Signing) va entre «Compilar el .msi» y «Subir».

name: Windows Release

on:
  push:
    tags: ['v*.*.*']          # (el mismo patrón que release.yml)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # La misma versión que windows.yml y que espera windows/scripts/test.ps1 (…\Toolchains\6.4.2+Asserts).
  SWIFT_VERSION: swift-6.4.2-release
  SWIFT_BUILD: 6.4.2-RELEASE
  WIX_VERSION: 4.0.6

jobs:
  release:
    name: Instalador de Windows
    # En los tags, sólo si se ha activado (WINDOWS_RELEASE=true) y no es un tag suelto «…-windows»; a mano, siempre.
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.WINDOWS_RELEASE == 'true' && !endsWith(github.ref_name, '-windows')) }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Sin conversión de fin de línea
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Toolchain de Swift para Windows
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-build: ${{ env.SWIFT_BUILD }}
      - name: Privacidad (nada personal en el repositorio)
        shell: bash
        run: bash tools/privacidad.sh

      - name: Tests del núcleo
        # REVISAR: sin «continue-on-error» cuando se arreglen los fallos intermitentes de permisos de archivos temporales (windows/ESTADO.md, P6).
        continue-on-error: true
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/scripts/test.ps1

      - name: La versión del tag, del manifiesto, del instalador y del actualizador es la misma
        id: version
        shell: pwsh
        run: |
          $wxs = [regex]::Match((Get-Content -Raw windows/installer/NetDeckWindows.wxs), '<\?define Version = "([^"]+)"\?>').Groups[1].Value
          $appx = [regex]::Match((Get-Content -Raw windows/Desktop/AppxManifest.xml), 'Version="(\d+\.\d+\.\d+)\.0"').Groups[1].Value
          $swift = [regex]::Match((Get-Content -Raw Sources/NetDeckCore/Update/UpdateChecker.swift), 'currentVersion = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "El tag $env:GITHUB_REF_NAME no es vX.Y.Z" }
            $version = $Matches[1]
          } else { $version = $wxs }            # (a mano: la del instalador)
          foreach ($par in @(@('NetDeckWindows.wxs', $wxs), @('AppxManifest.xml', $appx), @('UpdateChecker.currentVersion', $swift))) {
            if ($par[1] -ne $version) { throw "$($par[0]) dice '$($par[1])' y la versión es ${version}: cámbialas a la vez" }
          }
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Compilar la app en Release
        # Lo mismo que el build local (windows/scripts/desktop.ps1): resuelve con --force-resolved-versions, copia el bootstrapper de Windows App SDK y
        # usa -DOPENSSL_NO_ASM. No hace falta el DDLM del Windows App Runtime para COMPILAR (sólo para ejecutar la app, y aquí no se ejecuta).
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/scripts/desktop.ps1 -Configuration release

      - name: El ejecutable lleva el logo de NetDeck
        # desktop.ps1 compila windows/Desktop/NetDeck.rc con llvm-rc (de la toolchain de Swift) y Package.swift enlaza NetDeck.res. Si falta llvm-rc el script sólo avisa y
        # el .exe saldría con el icono genérico de Windows: aquí se corta, porque en una Release no debe pasar sin que se vea.
        shell: pwsh
        run: |
          if (-not (Test-Path windows/Desktop/NetDeck.res)) { throw 'Falta windows/Desktop/NetDeck.res: llvm-rc no se ha ejecutado, el .exe saldría sin icono' }
          $exe = Get-ChildItem -Recurse -Filter NetDeckWindows.exe (Join-Path $env:LOCALAPPDATA 'NetDeckDesktopBuild/out/Products/Release-windows-x86_64') | Select-Object -First 1
          if (-not $exe) { throw 'No se encuentra NetDeckWindows.exe compilado' }
          # (ExtractIconEx con índice -1 devuelve cuántos iconos lleva el archivo: 1 con el logo, 0 sin él; comprobado en local con NetDeckWindows.exe y NetDeckAskpass.exe)
          Add-Type -Namespace NetDeck -Name Iconos -MemberDefinition '[System.Runtime.InteropServices.DllImport("shell32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)] public static extern uint ExtractIconEx(string archivo, int indice, System.IntPtr[] grandes, System.IntPtr[] pequenos, uint cuantos);'
          if ([NetDeck.Iconos]::ExtractIconEx($exe.FullName, -1, $null, $null, 0) -lt 1) { throw 'NetDeckWindows.exe no lleva ningún icono: el logo no se ha incrustado' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: WiX 4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.dotnet/tools')

      - name: Preparar la carpeta del instalador
        shell: pwsh
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/preparar-instalador.ps1 -Configuracion release -Destino (Join-Path $carpeta 'files')

      - name: Compilar el .msi
        id: msi
        shell: pwsh
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          $msi = Join-Path $carpeta "Terminal-NetDeck-${{ steps.version.outputs.version }}.msi"
          wix build windows/installer/NetDeckWindows.wxs (Join-Path $carpeta 'archivos.wxs') -arch x64 -d "SourceDir=$(Join-Path $carpeta 'files')" -d "Version=${{ steps.version.outputs.version }}" -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix msi validate $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLower()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content -Encoding ASCII "$msi.sha256"
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "msi=$msi"

      - name: windows/CHANGELOG.md tiene la sección de esta versión
        # (las notas de la Release las pone macOS; aquí sólo se comprueba que la versión de Windows está documentada)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $texto = Get-Content -Raw -Encoding UTF8 windows/CHANGELOG.md
          if ($texto -notmatch "(?m)^## $([regex]::Escape($version))\b") { throw "windows/CHANGELOG.md no tiene una sección ## $version" }

      - name: Guardar el instalador (también en las pruebas a mano)
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: |
            ${{ steps.msi.outputs.msi }}
            ${{ steps.msi.outputs.msi }}.sha256
          if-no-files-found: error

      - name: Subir el .msi a la Release del tag (la crea release.yml de macOS)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $encontrada = $false
          for ($i = 0; $i -lt 60; $i++) {
              gh release view $tag --json tagName 2>$null | Out-Null
              if ($LASTEXITCODE -eq 0) { $encontrada = $true; break }
              Write-Host "Todavía no existe la Release $tag (la crea macOS); espero un minuto ($($i + 1)/60)"
              Start-Sleep -Seconds 60
          }
          if (-not $encontrada) { throw "La Release $tag no existe tras 60 minutos: ¿ha fallado release.yml (macOS)?" }
          # --clobber: sólo para repetir este job; no toca ni el título ni las notas ni el .dmg.
          gh release upload $tag '${{ steps.msi.outputs.msi }}' '${{ steps.msi.outputs.msi }}.sha256' --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
