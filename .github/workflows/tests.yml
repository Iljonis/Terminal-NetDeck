name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        run: swift --version
      - name: Privacidad (nada personal en el repositorio)
        run: tools/privacidad.sh
      - name: Compilar
        run: swift build
      - name: Tests
        run: swift test
