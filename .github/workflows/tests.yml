name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Xcode más reciente y castellano (los tests comprueban los textos en castellano)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          defaults write -g AppleLanguages -array es en
          swift --version
      - name: Privacidad (nada personal en el repositorio)
        run: tools/privacidad.sh
      - name: Actualizar conserva tus datos
        run: tools/test_actualizacion.sh
      - name: Compilar
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log || { echo "::error::$(swift --version 2>&1 | head -1)"; grep -E 'error:|While |Stack dump|^[0-9]+\.\s|\.swift:' build.log | grep -v warning | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Tests
        run: |
          set -o pipefail
          NETDECK_HOME=$(mktemp -d) swift test 2>&1 | tee test.log || { grep -E '✘|error:|Expectation failed|recorded an issue' test.log | head -40 | sed 's/^/::error::/'; exit 1; }
