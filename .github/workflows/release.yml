name: Release

# Al subir un tag «vX.Y.Z»: tests, .dmg (con NetDeckRepo de este repositorio), comprobación de privacidad del binario
# y la Release de GitHub con el .dmg. La app la ofrece sola («Actualizar ahora») a quien tenga una versión anterior.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode más reciente y castellano (los tests comprueban los textos en castellano)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          defaults write -g AppleLanguages -array es en
          swift --version
      - name: El tag coincide con VERSION de install.sh
        run: |
          v=$(grep -E '^VERSION=' install.sh | cut -d= -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::install.sh dice $v y el tag es $GITHUB_REF_NAME"; exit 1; }
      - name: Tests
        run: ./test.sh
      - name: .dmg
        run: NETDECK_REPO="$GITHUB_REPOSITORY" ./install.sh --dmg
      - name: Privacidad del binario
        run: tools/privacidad.sh --binario
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Terminal-NetDeck.dmg --title "Terminal NetDeck ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
