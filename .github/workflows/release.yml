name: Release

# Al subir un tag «vX.Y.Z»: tests, .dmg (con NetDeckRepo de este repositorio), comprobación de privacidad del binario
# y la Release de GitHub con el .dmg. La app la ofrece sola («Actualizar ahora») a quien tenga una versión anterior.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # historia y tags: las notas salen de los commits desde el tag anterior
      - name: Xcode más reciente y castellano (los tests comprueban los textos en castellano)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          defaults write -g AppleLanguages -array es en
          swift --version
      - name: El tag coincide con VERSION de install.sh
        run: |
          v=$(grep -E '^VERSION=' install.sh | cut -d= -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::install.sh dice $v y el tag es $GITHUB_REF_NAME"; exit 1; }
      - name: Tests
        run: ./test.sh
      - name: .dmg
        run: NETDECK_REPO="$GITHUB_REPOSITORY" ./install.sh --dmg
      - name: Interacción del paquete y demo
        run: tools/verificar_paquete.sh build/qa
      - name: SSH y SFTP reales en loopback
        run: tools/test_ssh_local.sh
      - name: Informes y capturas del paquete
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-paquete
          # (repo público: sólo capturas e informes; los .log pueden llevar rutas del runner)
          path: |
            build/qa
            !build/qa/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Privacidad del binario
        run: tools/privacidad.sh --binario
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Notas: título y viñetas de cada commit desde el tag anterior (--generate-notes sólo mira PRs y aquí no hay)
        run: |
          anterior=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            git log --no-merges --format='### %s%n%n%b' ${anterior:+"$anterior.."}"$GITHUB_REF_NAME"
            echo "Descarga \`Terminal-NetDeck.dmg\` (macOS 15 o posterior); si ya la tienes, la app lo ofrece en «Actualizar ahora»."
            [ -z "$anterior" ] || echo "**Cambios**: https://github.com/$GITHUB_REPOSITORY/compare/$anterior...$GITHUB_REF_NAME"
          } > notas.md
          gh release create "$GITHUB_REF_NAME" dist/Terminal-NetDeck.dmg --title "Terminal NetDeck ${GITHUB_REF_NAME#v}" \
            --notes-file notas.md --verify-tag
