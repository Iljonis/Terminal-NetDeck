# Windows Release: compila la app WinUI en Release y genera el instalador de un paso (Setup.exe con el .msi dentro), el .msi suelto
# (despliegues gestionados) y la versión portable (.zip). Los tres llevan DENTRO Windows App Runtime 1.5 y el cliente OpenSSH
# (windows/installer/incluir-dependencias.ps1): no piden instalar nada en el PC. El job «probar-instalador» prueba la portable y el
# Setup.exe en un Windows sin el runtime y comprueba que no lo instalan.
#
# Con un tag «vX.Y.Z» (el MISMO que la Release de macOS, release.yml) sube el Setup.exe, el .msi, el .zip y sus .sha256 a esa Release, DESPUÉS de que
# macOS la cree (este flujo no la crea: `gh release create` de release.yml falla si ya existe). A mano («Run workflow») y en los
# push a una rama que cambien este archivo hace lo mismo SIN subir nada: deja los archivos como artefacto «windows-release».
#
# Tres jobs: «build» (permisos de sólo lectura, sin credenciales guardadas: ejecuta acciones de terceros, SwiftPM y dotnet),
# «probar-instalador» (también de sólo lectura) y «publish» (única parte con `contents: write`; sólo baja el artefacto y lo sube, y sólo si
# la prueba del Setup.exe ha pasado). Las acciones van fijadas por SHA.
#
# La versión de Windows es la del repositorio: el tag, NetDeckWindows.wxs, AppxManifest.xml y UpdateChecker.currentVersion tienen que
# decir lo mismo (el paso «La versión…» lo comprueba), y windows/CHANGELOG.md necesita su sección. El actualizador de la app usa
# `releases/latest`.
#
# ACTIVACIÓN en tags: sólo si la variable del repositorio WINDOWS_RELEASE vale «true» (un tag de sólo-macOS no lo dispara).
#
# SIN FIRMA: no hay certificado todavía. El Setup.exe, el .msi y el .exe salen sin firmar: SmartScreen avisa y el actualizador de la app
# rechaza un instalador sin firmar (hay que descargar a mano). Cuando exista el certificado, la firma (signtool o Azure Trusted Signing) va
# entre «Compilar el .msi» y «Guardar los archivos»: el .msi antes de compilar el Setup.exe, y el Setup.exe con `wix burn detach` (firmar
# el motor) + `wix burn reattach` + firmar el resultado.
#
# PORTABLE: el .zip lleva el archivo NetDeck.portable junto al ejecutable; con él, la app guarda sus datos en la carpeta «datos» de al
# lado (PortableMode en NetDeckCore). Se descomprime y se abre: no necesita administrador ni instalar nada.
#
# DEPENDENCIAS: Windows App Runtime 1.5 (del NuGet oficial Microsoft.WindowsAppSDK, en modo «self-contained») y Win32-OpenSSH, de URL fijas
# con sha256 en windows/installer/dependencias.json; se comprueba la firma de Microsoft de cada .exe y .dll.

name: Windows Release

on:
  push:
    tags: ['v*.*.*']          # (el mismo patrón que release.yml)
    branches: ['windows/**', propuesta/windows]
    paths: ['.github/workflows/windows-release.yml', 'windows/installer/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # La misma versión que windows.yml y que espera windows/scripts/test.ps1 (…\Toolchains\6.4.2+Asserts).
  SWIFT_VERSION: swift-6.4.2-release
  SWIFT_BUILD: 6.4.2-RELEASE
  WIX_VERSION: 4.0.6

jobs:
  build:
    name: Instalador y portable de Windows
    # Ramas y ejecución a mano: siempre. Tags: sólo si se ha activado (WINDOWS_RELEASE=true) y no es un tag suelto «…-windows».
    if: ${{ github.ref_type == 'branch' || (vars.WINDOWS_RELEASE == 'true' && !endsWith(github.ref_name, '-windows')) }}
    # windows-2022 (Visual Studio 2022) y no windows-latest: con la imagen de VS 2026 el STL exige Clang 22 (STL1000) y el de Swift 6.4.2 es anterior.
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Sin conversión de fin de línea
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain de Swift para Windows
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          swift-build: ${{ env.SWIFT_BUILD }}
      - name: Privacidad (nada personal en el repositorio)
        shell: bash
        run: bash tools/privacidad.sh

      - name: La versión del tag, del manifiesto, del instalador y del actualizador es la misma
        id: version
        shell: pwsh
        run: |
          $wxs = [regex]::Match((Get-Content -Raw windows/installer/NetDeckWindows.wxs), '<\?define Version = "([^"]+)"\?>').Groups[1].Value
          $appx = [regex]::Match((Get-Content -Raw windows/Desktop/AppxManifest.xml), 'Version="(\d+\.\d+\.\d+)\.0"').Groups[1].Value
          $swift = [regex]::Match((Get-Content -Raw Sources/NetDeckCore/Update/UpdateChecker.swift), 'currentVersion = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "El tag $env:GITHUB_REF_NAME no es vX.Y.Z" }
            $version = $Matches[1]
          } else { $version = $wxs }            # (a mano: la del instalador)
          foreach ($par in @(@('NetDeckWindows.wxs', $wxs), @('AppxManifest.xml', $appx), @('UpdateChecker.currentVersion', $swift))) {
            if ($par[1] -ne $version) { throw "$($par[0]) dice '$($par[1])' y la versión es ${version}: cámbialas a la vez" }
          }
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Compilar la app en Release
        # Lo mismo que el build local (windows/scripts/desktop.ps1): resuelve con --force-resolved-versions, copia el bootstrapper de Windows App SDK y
        # usa -DOPENSSL_NO_ASM. No hace falta el DDLM del Windows App Runtime para COMPILAR (sólo para ejecutar la app, y aquí no se ejecuta).
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/scripts/desktop.ps1 -Configuration release

      - name: El ejecutable lleva el logo de NetDeck
        # desktop.ps1 compila windows/Desktop/NetDeck.rc con llvm-rc (de la toolchain de Swift) y Package.swift enlaza NetDeck.res. Si falta llvm-rc el script sólo avisa y
        # el .exe saldría con el icono genérico de Windows: aquí se corta, porque en una Release no debe pasar sin que se vea.
        shell: pwsh
        run: |
          if (-not (Test-Path windows/Desktop/NetDeck.res)) { throw 'Falta windows/Desktop/NetDeck.res: llvm-rc no se ha ejecutado, el .exe saldría sin icono' }
          $exe = Get-ChildItem -Recurse -Filter NetDeckWindows.exe (Join-Path $env:LOCALAPPDATA 'NetDeckDesktopBuild/out/Products/Release-windows-x86_64') | Select-Object -First 1
          if (-not $exe) { throw 'No se encuentra NetDeckWindows.exe compilado' }
          # (ExtractIconEx con índice -1 devuelve cuántos iconos lleva el archivo: 1 con el logo, 0 sin él; comprobado en local con NetDeckWindows.exe y NetDeckAskpass.exe)
          Add-Type -Namespace NetDeck -Name Iconos -MemberDefinition '[System.Runtime.InteropServices.DllImport("shell32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)] public static extern uint ExtractIconEx(string archivo, int indice, System.IntPtr[] grandes, System.IntPtr[] pequenos, uint cuantos);'
          if ([NetDeck.Iconos]::ExtractIconEx($exe.FullName, -1, $null, $null, 0) -lt 1) { throw 'NetDeckWindows.exe no lleva ningún icono: el logo no se ha incrustado' }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: WiX 4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          Add-Content -Encoding utf8 -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.dotnet/tools')

      - name: Preparar la carpeta del instalador
        shell: pwsh
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/preparar-instalador.ps1 -Configuracion release -Destino (Join-Path $carpeta 'files')

      - name: Compilar el .msi
        id: msi
        shell: pwsh
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          $msi = Join-Path $carpeta "Terminal-NetDeck-${{ steps.version.outputs.version }}.msi"
          wix build windows/installer/NetDeckWindows.wxs (Join-Path $carpeta 'archivos.wxs') -arch x64 -d "SourceDir=$(Join-Path $carpeta 'files')" -d "Version=${{ steps.version.outputs.version }}" -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix msi validate $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "msi=$msi"

      - name: Compilar el Setup.exe (el .msi en un instalador de un paso)
        # build-bundle.ps1 mete el .msi en un bundle de Burn (NetDeckBundle.wxs): una pantalla con la licencia y «Instalar».
        id: setup
        shell: pwsh
        run: |
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          $setup = Join-Path $carpeta "Terminal-NetDeck-${{ steps.version.outputs.version }}-Setup.exe"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/build-bundle.ps1 -Msi '${{ steps.msi.outputs.msi }}' -Out $setup -Version '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $setup)) { throw "No se ha generado $setup" }
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "setup=$setup"

      - name: Preparar la versión portable (.zip)
        id: portable
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $carpeta = Join-Path $env:RUNNER_TEMP 'instalador'
          $nombre = "Terminal-NetDeck-$version-portable-x64"
          $raiz = Join-Path $carpeta $nombre
          Copy-Item -Recurse (Join-Path $carpeta 'files') $raiz
          # (el registro del Sparse Package es del instalador; el portable no registra nada en Windows)
          foreach ($f in 'registrar-sparse.ps1', 'quitar-sparse.ps1', 'NetDeckSparse.msix') { Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $raiz $f) }
          New-Item -ItemType File -Path (Join-Path $raiz 'NetDeck.portable') | Out-Null
          $leeme = @(
            'Terminal NetDeck para Windows (versión portable)'
            ''
            '1. Descomprime esta carpeta donde quieras (tu carpeta de usuario, un USB...) y ejecuta NetDeckWindows.exe.'
            '   No hace falta ser administrador ni instalar nada: lleva dentro Windows App Runtime 1.5 y el cliente OpenSSH'
            '   (carpeta OpenSSH, de Microsoft).'
            '2. Sesiones, botones, listas y copias se guardan en la carpeta "datos" de al lado (NetDeck.portable activa este modo).'
            '   Para volver al modo normal, borra el archivo NetDeck.portable.'
            '3. Sin firma de código: Windows SmartScreen puede avisar al abrirlo ("Más información" > "Ejecutar de todas formas").'
            '   Para que no avise con cada archivo, antes de descomprimir: clic derecho en el .zip > Propiedades > "Desbloquear".'
            '4. No se actualiza solo: descarga la versión nueva y copia dentro tu carpeta "datos".'
          )
          [System.IO.File]::WriteAllLines((Join-Path $raiz 'LEEME.txt'), $leeme, (New-Object System.Text.UTF8Encoding $true))
          $zip = Join-Path $carpeta "$nombre.zip"
          Compress-Archive -Path $raiz -DestinationPath $zip -CompressionLevel Optimal
          Add-Content -Encoding utf8 -Path $env:GITHUB_OUTPUT -Value "zip=$zip"

      - name: Sumas sha256 de los archivos
        id: sumas
        shell: pwsh
        run: |
          foreach ($f in '${{ steps.setup.outputs.setup }}', '${{ steps.msi.outputs.msi }}', '${{ steps.portable.outputs.zip }}') {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Set-Content -Encoding ASCII "$f.sha256"
            Write-Host "$hash  $(Split-Path $f -Leaf)"
          }

      - name: windows/CHANGELOG.md tiene la sección de esta versión
        # (las notas de la Release las pone macOS; aquí sólo se comprueba que la versión de Windows está documentada; en las pruebas a mano no hace falta)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $texto = Get-Content -Raw -Encoding UTF8 windows/CHANGELOG.md
          if ($texto -notmatch "(?m)^## $([regex]::Escape($version))\b") { throw "windows/CHANGELOG.md no tiene una sección ## $version" }

      - name: Guardar los archivos (también en las pruebas a mano)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release
          path: |
            ${{ steps.setup.outputs.setup }}
            ${{ steps.setup.outputs.setup }}.sha256
            ${{ steps.msi.outputs.msi }}
            ${{ steps.msi.outputs.msi }}.sha256
            ${{ steps.portable.outputs.zip }}
            ${{ steps.portable.outputs.zip }}.sha256
          if-no-files-found: error

  probar-instalador:
    # La portable y el Setup.exe recién compilados, en un Windows SIN Windows App Runtime 1.5 (si la imagen lo trae, se quita antes): la portable
    # tiene que abrirse sin instalar nada, el Setup.exe tiene que instalar la app sin ningún paso a mano, la app tiene que arrancar sin que
    # aparezca el runtime en Windows (lo lleva dentro) y desinstalar tiene que quitar NetDeck.
    # (shell: powershell, el 5.1 de Windows: los cmdlets de Appx no van en pwsh 7 sin -UseWindowsPowerShell)
    name: Probar la portable y el Setup.exe en un Windows sin el runtime
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: windows/installer
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-release
          path: archivos

      - name: Quitar Windows App Runtime 1.5 si la imagen lo trae
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-AppxPackage -AllUsers -Name '*WinAppRuntime*' | Select-Object Name, Version, Architecture | Format-Table -AutoSize | Out-String | Write-Host
          Get-AppxPackage -AllUsers -Name 'Microsoft.WindowsAppRuntime.*' | Select-Object Name, Version, Architecture | Format-Table -AutoSize | Out-String | Write-Host
          # (de lo que depende a lo que se depende: DDLM, Singleton y Main antes que el Framework)
          foreach ($nombre in 'Microsoft.WinAppRuntime.DDLM.5001*', 'MicrosoftCorporationII.WinAppRuntime.Singleton', 'MicrosoftCorporationII.WinAppRuntime.Main.1.5', 'Microsoft.WindowsAppRuntime.1.5') {
            Get-AppxProvisionedPackage -Online | Where-Object { $_.DisplayName -like $nombre } | ForEach-Object {
              Write-Host "Desaprovisionando $($_.PackageName)"; Remove-AppxProvisionedPackage -Online -AllUsers -PackageName $_.PackageName | Out-Null }
            Get-AppxPackage -AllUsers -Name $nombre | ForEach-Object { Write-Host "Quitando $($_.PackageFullName)"; Remove-AppxPackage -AllUsers -Package $_.PackageFullName }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/detectar-runtime.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Windows App Runtime 1.5 sigue instalado: no se puede probar sin el' }
          Write-Host 'Sin Windows App Runtime 1.5: listo para probar'
          # (el paso acaba con el código de la última orden externa: detectar-runtime.ps1 ha salido con 1 a propósito)
          exit 0

      - name: La portable se abre sin instalar nada y lleva su OpenSSH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem archivos -Filter '*-portable-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No esta la portable en el artefacto' }
          $carpeta = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $carpeta
          $raiz = Get-ChildItem $carpeta -Directory | Select-Object -First 1
          $exe = Join-Path $raiz.FullName 'NetDeckWindows.exe'
          foreach ($f in 'Microsoft.WindowsAppRuntime.dll', 'Microsoft.UI.Xaml.Controls.pri', 'OpenSSH\ssh.exe', 'OpenSSH\sftp.exe') {
            if (-not (Test-Path (Join-Path $raiz.FullName $f))) { throw "La portable no lleva $f" }
          }
          $ErrorActionPreference = 'Continue'
          $version = (& (Join-Path $raiz.FullName 'OpenSSH\ssh.exe') -V 2>&1 | Out-String).Trim()     # (ssh -V escribe en stderr)
          $ErrorActionPreference = 'Stop'
          Write-Host "OpenSSH incluido: $version"
          if ("$version" -notmatch 'OpenSSH_for_Windows') { throw "OpenSSH\ssh.exe no responde como OpenSSH: $version" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/probar-arranque.ps1 -Exe $exe
          if ($LASTEXITCODE -ne 0) { throw 'La portable no arranca en un Windows sin el runtime' }
          if (-not (Test-Path (Join-Path $raiz.FullName 'datos'))) { throw 'La portable no ha creado su carpeta datos (NetDeck.portable)' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/detectar-runtime.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Tras abrir la portable aparece Windows App Runtime 1.5 instalado: no tendria que instalar nada' }
          exit 0

      - name: Instalar con el Setup.exe, en silencio y sin pasos a mano
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem archivos -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No esta el Setup.exe en el artefacto' }
          $log = Join-Path $env:RUNNER_TEMP 'setup-instalar.log'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/quiet', '/norestart', '/log', "`"$log`"" -Wait -PassThru
          Write-Host "Setup.exe /quiet salio con $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80 | Write-Host; throw "El Setup.exe ha fallado ($($p.ExitCode)): mira el artefacto de registros" }

          $exe = Join-Path ${env:ProgramFiles} 'Terminal NetDeck\NetDeckWindows.exe'
          if (-not (Test-Path $exe)) { throw "No se ha instalado $exe" }
          if (-not (Test-Path (Join-Path ${env:ProgramFiles} 'Terminal NetDeck\OpenSSH\ssh.exe'))) { throw 'La instalacion no lleva OpenSSH\ssh.exe' }
          # Una sola entrada en Aplicaciones instaladas: la del bundle (el .msi va oculto, SystemComponent=1)
          $claves = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $visibles = @(Get-ItemProperty $claves -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Terminal NetDeck' -and $_.SystemComponent -ne 1 })
          $visibles | Select-Object DisplayName, DisplayVersion, PSChildName | Format-Table -AutoSize | Out-String | Write-Host
          if ($visibles.Count -ne 1) { throw "Tendria que haber UNA entrada visible de Terminal NetDeck en Aplicaciones instaladas y hay $($visibles.Count)" }

      - name: La app instalada arranca con el runtime que lleva dentro
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NETDECK_HOME = Join-Path $env:RUNNER_TEMP 'netdeck-home'
          New-Item -ItemType Directory -Force $env:NETDECK_HOME | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/probar-arranque.ps1 -Exe (Join-Path ${env:ProgramFiles} 'Terminal NetDeck\NetDeckWindows.exe')
          if ($LASTEXITCODE -ne 0) { throw 'La app instalada no arranca en un Windows sin el runtime' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/installer/detectar-runtime.ps1
          if ($LASTEXITCODE -eq 0) { throw 'El Setup.exe ha instalado Windows App Runtime 1.5 en Windows: ya no tendria que hacerlo' }
          exit 0

      - name: Desinstalar quita NetDeck
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem archivos -Filter '*-Setup.exe' | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'setup-desinstalar.log'
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/uninstall', '/quiet', '/norestart', '/log', "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80 | Write-Host; throw "La desinstalacion ha fallado ($($p.ExitCode))" }
          if (Test-Path (Join-Path ${env:ProgramFiles} 'Terminal NetDeck\NetDeckWindows.exe')) { throw 'Tras desinstalar sigue NetDeckWindows.exe en Program Files' }

      - name: Registros del Setup.exe
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registros-setup
          path: ${{ runner.temp }}/setup-*.log
          if-no-files-found: ignore

  publish:
    name: Subir a la Release
    needs: [build, probar-instalador]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write           # (lo único que escribe; no ejecuta nada de terceros salvo estas dos acciones fijadas)
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-release
          path: archivos
      - name: Subir el .msi y el .zip a la Release del tag (la crea release.yml de macOS)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          encontrada=0
          for i in $(seq 1 60); do
            if gh release view "$tag" --json tagName >/dev/null 2>&1; then encontrada=1; break; fi
            echo "Todavía no existe la Release $tag (la crea macOS); espero un minuto ($i/60)"
            sleep 60
          done
          [ "$encontrada" = 1 ] || { echo "La Release $tag no existe tras 60 minutos: ¿ha fallado release.yml (macOS)?"; exit 1; }
          # --clobber: sólo para repetir este job; no toca ni el título ni las notas ni el .dmg.
          gh release upload "$tag" archivos/* --clobber
