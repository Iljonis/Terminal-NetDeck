name: Seguridad

# Auditoría semanal: dependencias contra OSV.dev (CVE/GHSA), privacidad, tests y endurecimiento de la app.
on:
  schedule:
    - cron: "0 7 * * 1"        # lunes, 7:00 UTC
  workflow_dispatch:

jobs:
  auditoria:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode más reciente y castellano (los tests comprueban los textos en castellano)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          defaults write -g AppleLanguages -array es en
          swift --version
      - name: App compilada (para comprobar firma y Info.plist)
        run: ./install.sh --dmg
      - name: Auditoría
        run: tools/seguridad_cron.sh
