# Dependabot: avisa (con un PR) de versiones nuevas y de seguridad de las dependencias de SwiftPM (SwiftTerm,
# swift-png…) y de las acciones de los workflows. Complementa a tools/seguridad_cron.sh (OSV.dev).
version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
