# ═══════════════════════════════════════════════════════════════════════
#  Resaltado NetDeck · Cyber Neón · redes y servidores (ChromaTerm)
#  Se aplica a todo ssh dentro de NetDeck (las sesiones nuevas lo cogen solas).
#  color: "f.nombre" texto · "b.nombre" fondo · bold / underline / italic
#  exclusive: true → esa zona ya no la colorea ninguna otra regla
# ═══════════════════════════════════════════════════════════════════════
palette:  # >>> paleta (la escribe «tema»)
  yellow:  '#fcee0a'
  cyan:    '#00f0ff'
  red:     '#ff003c'
  green:   '#00ff9f'
  magenta: '#ff2bd6'
  orange:  '#fe7723'
  blue:    '#7397ed'
  dark:    '#08090d'
  dim:     '#5e8a94'
# <<< paleta

rules:
# >>> prompts (los escribe «tema»)
# ── PROMPTS · estilo HUD: usuario cian · @ apagado · equipo amarillo · > rojo ─
- description: Prompt Linux (usuario@equipo:ruta$)
  regex: (?m)^([\w.-]+)(@)([\w.-]+)(:)([^\s$#]*)([$#])(?=\s|$)
  color: {1: f.cyan bold, 2: f.dim, 3: f.yellow bold, 4: f.dim, 5: f.blue, 6: f.red bold}
  exclusive: true
- description: Prompt RHEL/CentOS ([usuario@equipo ruta]$)
  regex: (?m)^(\[)([\w.-]+)(@)([\w.-]+)( [^\]]*)?(\])([$#])
  color: {1: f.dim, 2: f.cyan bold, 3: f.dim, 4: f.yellow bold, 5: f.blue, 6: f.dim, 7: f.red bold}
  exclusive: true
- description: Prompt Juniper (usuario@equipo>)
  regex: (?m)^([\w.-]+)(@)([\w.-]+)([>#%])(?=\s|$)
  color: {1: f.cyan bold, 2: f.dim, 3: f.yellow bold, 4: f.red bold}
  exclusive: true
- description: Prompt Huawei <EQUIPO>
  regex: (?m)^(<)([~*]?[\w.-]+)(>)
  color: {1: f.red bold, 2: f.yellow bold, 3: f.red bold}
  exclusive: true
- description: Contexto Nokia SR-OS MD-CLI ([ex:/configure …])
  regex: (?m)^(\[)((?:ex|gl|pr|ro|bof|li):)?(/[^\]\r\n]*)(\])\s*$
  color: {1: f.dim, 2: f.magenta bold, 3: f.blue, 4: f.dim}
  exclusive: true
- description: Prompt Huawei [~EQUIPO-modo]
  regex: (?m)^(\[)([~*]?[\w.-]+(?:-[\w./-]+)?)(\])
  color: {1: f.red bold, 2: f.yellow bold, 3: f.red bold}
  exclusive: true
- description: Prompt Nokia SR-OS (*A:equipo>config# · A:usuario@equipo#)
  regex: (?m)^(\*)?([AB])(:)(?:([\w.-]+)(@))?([\w.-]+)((?:>[\w-]+)*)([#$>])(?:[ \t]+(show|configure|admin|tools|info|file|monitor|clear|debug|environment|edit-config|quit-config|commit|discard|validate|compare|exit|back|ping|traceroute|oam|password|logout)\b)?
  color: {1: f.red bold, 2: f.magenta bold, 3: f.dim, 4: f.cyan bold, 5: f.dim, 6: f.yellow bold, 7: f.blue, 8: f.red bold, 9: bold}
  exclusive: true
- description: Prompt Cisco/HP/Edge-Core EQUIPO(config)#
  regex: (?m)^([A-Za-z][\w/:.-]*)(\([\w-]+\))?(#)(?=\s|$|\w)
  color: {1: f.yellow bold, 2: f.magenta, 3: f.red bold}
  exclusive: true
# <<< prompts

# ── ÓPTICA · rojo si peor que -25 dBm (o sin luz) ──────────────────────────
- description: dBm malo
  regex: (?i)-(2[5-9]|[3-9]\d)(\.\d+)?\s?dbm|-40\.00
  color: f.red bold underline
  exclusive: true
- description: dBm
  regex: (?i)[-+]?\d+(\.\d+)?\s?dbm
  color: f.magenta bold
  exclusive: true

# ── PING / TRACEROUTE ──────────────────────────────────────────────────────
- description: Sin pérdida
  regex: \b0(\.0+)?% (packet )?loss
  color: f.green bold
  exclusive: true
- description: Pérdida total
  regex: \b100(\.0+)?% (packet )?loss
  color: f.red bold underline
  exclusive: true
- description: Pérdida parcial
  regex: \b\d{1,2}(\.\d+)?% (packet )?loss
  color: f.orange bold
  exclusive: true
- description: Latencia
  regex: (?i)\btime[=<]\s?\d+(\.\d+)?\s?ms\b|\b\d+(\.\d+)?\s?ms\b
  color: f.cyan
- description: Traceroute sin respuesta
  regex: (\*\s+){2}\*
  color: f.red bold

# ── ERRORES Y CONTADORES ────────────────────────────────────────────────────
# (nombre delante: Junos «Input errors: 12», Huawei «CRC: 3», ifconfig «RX errors 3», ethtool «rx_crc_errors: 12»;
#  sin «:», un solo espacio: con dos, el número es del contador siguiente, como en NX-OS «0 CRC  5 no buffer»; salvo si
#  detrás sólo quedan números, las columnas de Junos «CRC/Align errors   5   0»)
- description: Contador de errores distinto de cero
  regex: (?i)\b(input errors|output errors|errors?|crc|drops?|dropped|discards?|collisions|overruns?|runts|giants|frame|ignored|aborts?|resets?|flaps?|carrier transitions|[rt]x_\w{0,40}?(?:errors?|crc|drops?|dropped|discards?|missed)\w{0,40}+)(\s*[:=]\s*|[ \t]|[ \t]{2,}(?=[1-9][\d,]*(?:[ \t]+[\d,]+)*[ \t\r]*$))([1-9][\d,]*)\b
  color: {1: f.orange, 3: f.red bold}
  exclusive: true
# (número delante: IOS «12 input errors, 10 CRC», NX-OS «5 no buffer», IOS-XR «12 total input drops»; no el de «dropped 3
#  overruns» ni «4 output buffers swapped out»)
- description: Contador de errores distinto de cero (número delante, IOS)
  regex: (?i)(?=[1-9])(?<![a-z:=] )(?<![\w.,/:-])([1-9](?:[\d,]*\d)?) ((?:input |output |late |short |bad etype |bad proto |if down |unknown protocol |interface |output buffer |lost |no |total input |total output )?(?:errors?|crc|frame|overruns?|underruns?|ignored|aborts?|runts|giants|throttles|collisions?|babbles?|carrier(?: transitions)?|buffer|resets|failures|drops?|discards?|watchdog|parity))\b
  color: {1: f.red bold, 2: f.orange}
  exclusive: true
- description: Errores de Linux
  regex: (?i)permission denied|no such file or directory|command not found|connection refused|connection timed out|no route to host|host is unreachable|network is unreachable|name or service not known|segmentation fault|out of memory|killed process|traceback \(most recent call last\)|read-only file system|no space left on device|authentication failed|access denied
  color: f.red bold
- description: Syslog Cisco grave (%FAC-0..3-MSG)
  regex: '%[A-Z0-9_]+-[0-3]-[A-Z0-9_]+'
  color: f.red bold
  exclusive: true
- description: Syslog Cisco aviso (%FAC-4-MSG)
  regex: '%[A-Z0-9_]+-4-[A-Z0-9_]+'
  color: f.orange bold
  exclusive: true
- description: Syslog Cisco informativo (%FAC-5..7-MSG)
  regex: '%[A-Z0-9_]+-[5-7]-[A-Z0-9_]+'
  color: f.cyan
  exclusive: true
- description: Syslog IOS-XR y Huawei (%FAC-SUB-0..7-MSG · %%01MOD/0..7/MSG)
  regex: '(%[A-Z0-9_]+-[A-Z0-9_]+-[0-3]-[A-Z0-9_]+|%%\d\d[A-Z0-9_]+/[0-3]/[A-Za-z0-9_]+(?:\([a-z]\))?)|(%[A-Z0-9_]+-[A-Z0-9_]+-4-[A-Z0-9_]+|%%\d\d[A-Z0-9_]+/4/[A-Za-z0-9_]+(?:\([a-z]\))?)|(%[A-Z0-9_]+-[A-Z0-9_]+-[5-7]-[A-Z0-9_]+|%%\d\d[A-Z0-9_]+/[5-7]/[A-Za-z0-9_]+(?:\([a-z]\))?)'
  color: {1: f.red bold, 2: f.orange bold, 3: f.cyan}
  exclusive: true
- description: Alarmas Nokia SR-OS (CRITICAL · MAJOR · MINOR · WARNING · CLEARED)
  regex: \b(CRITICAL|MAJOR|FLAG_NOK)\b|\b(MINOR|WARNING|INDETERMINATE)\b|\b(CLEARED|FLAG_OK)\b
  color: {1: f.red bold, 2: f.orange bold, 3: f.green bold}
  exclusive: true
- description: Niveles de log graves
  regex: \b(EMERG(ENCY)?|ALERT|CRIT(ICAL)?|ERR(OR)?|FATAL|PANIC|FAIL(ED|URE)?)\b
  color: f.red bold
- description: Niveles de log aviso
  regex: \b(WARN(ING)?|NOTICE|DEPRECATED)\b
  color: f.orange bold
- description: Niveles de log informativos
  regex: \b(INFO|DEBUG|TRACE)\b
  color: f.dim

# ── ESTADOS ─────────────────────────────────────────────────────────────────
- description: systemd activo
  regex: active \(running\)|active \(exited\)|enabled;
  color: f.green bold
  exclusive: true
- description: systemd parado
  regex: inactive \(dead\)|disabled;|activating \([\w-]+\)|deactivating
  color: f.orange bold
  exclusive: true
# (una parada a propósito no es una avería: «apagado», no rojo; la línea «shutdown» de la configuración, también)
- description: Parada intencionada (administratively down · admin down · Idle (Admin) · *down)
  regex: (?im)\badministratively down\b|\badmin[ -]?down\b|\b(?:Idle|Shut) \(Admin\)|\*down\b(?<![\w*^]\*down)|^[ \t]*shutdown[ \t\r]*$
  color: f.dim bold
  exclusive: true
# (columna de estado de «show ip bgp summary» de IOS, Junos, Huawei y Nokia, y «BGP state = …» o «State: … Flags:»)
- description: BGP sin sesión (Active · Idle · Connect)
  regex: (?m)^[ \t]*(?:\d{1,3}(?:\.\d{1,3}){3}|[0-9A-Fa-f]{0,4}(?::[0-9A-Fa-f]{0,4}){2,7}|\d+)[ \t](?:.*[ \t])?(Active|Idle|Connect|OpenSent|OpenConfirm)(?:[ \t]*\((?:PfxCt|NoNeg|NoNem)\))?(?:[ \t]+\d+)?[ \t\r]*$|\bBGP (?:current )?state\s*[=:]\s*(Active|Idle|Connect|OpenSent|OpenConfirm)\b|\bState: (Active|Idle|Connect|OpenSent|OpenConfirm)(?=\s+Flags:)
  color: {1: f.red bold, 2: f.red bold, 3: f.red bold}
# (no: «Up/Down» de las cabeceras, «exec-timeout 10», «timeout 5», «Dead Time», «dead-interval», dead:beef::1, «no
#  shutdown», «0 lost carrier», «0 input error», «0 if down drop»; ni lo que dice una «description»)
- description: Estados malos
  regex: (?i)\b(down(?<!up/down)(?! drop)|\^down|disconnected|error(?<!\b0 input error|\b0 output error)(?!:[ \t]*none\b)|disabled|err-?disabled|not ?connect(?:ed)?|not ok|not ?present|absent|failed|failure|fail|unreachable|timeout(?<![\w-]timeout)(?![ \t]*[:=]?[ \t]*\d)|timed out|denied|rejected?|shutdown(?<!no shutdown|undo shutdown)|offline|los|lof|idle|connect|opensent|openconfirm|invalid|no light|exited|unhealthy|dead(?<![\w:-]dead|pri\s{1,8}dead)(?![\w:-]|[ -]?(?:time|interval|timer)\b|[ \t]+\d)|blocking|blk|discarding|unselected|isolated|lost(?! carrier)|critical|major)\b(?<!description.{1,200})
  color: f.red bold
- description: Avisos
  regex: (?i)\b(warn(ing)?|minor|flap(ping)?|degraded|loss|retrans\w*|half|half-duplex|mismatch|2way|exstart|exchange|loading|init|learning|lrn|standby|suspended|pending|restarting|paused|time_wait|close_wait|syn_sent|syn_recv|fin_wait\d?)\b(?<!description.{1,200})
  color: f.orange bold
- description: Estados buenos
  regex: (?i)\b(up(?!/d(?:own|wn)\b)|established|establ|estab|connected|enabled?|online|ok(?!\?)|success(ful)?|normal|forwarding|fwd|full|full-duplex|present|running|reachable|active-up|healthy|listen|bndl|selected|synced|in sync|master|primary)\b(?<!description.{1,200})
  color: f.green bold

# ── DIRECCIONES ─────────────────────────────────────────────────────────────
- description: IPv4 / prefijo / puerto
  regex: \b(?<![\d.])(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}(/\d{1,2})?(:\d{1,5})?(?![\d.])
  color: f.cyan bold
- description: IPv6
  regex: (?i)(?<![\w:])(([0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|([0-9a-f]{1,4}:){1,6}(:[0-9a-f]{1,4}){1,6}|([0-9a-f]{1,4}:){1,7}:|::([0-9a-f]{1,4}:){0,5}[0-9a-f]{1,4})(/\d{1,3})?(?![\w:])
  color: f.cyan
  exclusive: true
- description: MAC
  regex: (?i)\b([0-9a-f]{2}[:-]){5}[0-9a-f]{2}\b|\b([0-9a-f]{4}[.-]){2}[0-9a-f]{4}\b
  color: f.magenta
  exclusive: true
- description: URL
  regex: (?i)\b(https?|ftp|ssh|tftp|snmp)://[^\s'"<>]+
  color: f.blue underline
  exclusive: true

# ── VLAN (antes que las interfaces: «vlan 100», «VLAN0100», «vlan-id 20») ───
- description: VLAN
  regex: (?i)\bvlan(?:[ -]?id)?\s?\d{1,4}\b
  color: f.magenta bold

# ── INTERFACES (Juniper, Huawei, Cisco, HPE, Dell, UfiSpace, Edge-Core, Linux) ─
# (agrupada por la primera letra: así cada posición sólo prueba una rama, no las 40)
- description: Interfaces
  regex: (?i)\b(?:(?:25|40|50|100|400)gigabitethernet\s?\d+(?:/\d+)*(?:\.\d+)?|(?:400|100|25|10|40|50)ge\d+(?:/\d+)+(?:\.\d+)?|ae-?\d+(?:/\d+)*(?:\.\d+)?|b(?:[dv]i\d+|e\d+(?:\.\d+)?|undle-ether\s?\d+(?:\.\d+)?|ridge-aggregation\s?\d+|ond\d+|r-\w+)|docker\d+|e(?:[tm]-?\d+(?:/\d+)*(?:\.\d+)?|th\d+(?:/\d+)+(?:\.\d+)?|th-trunk\s?\d+(?:\.\d+)?|thernet\s?\d+(?:/\d+)+(?:\.\d+)?|th\s?\d+/\s?\d+|th\d+(?:\.\d+)?|ns\d+\w*|np\w+|no\d+)|f(?:astethernet\s?\d+(?:/\d+)+(?:\.\d+)?|xp-?\d+(?:/\d+)*(?:\.\d+)?|o(?:rty|urhundred)gig(?:abit)?(?:ethernet|e)?\s?\d+(?:/\d+)*(?:\.\d+)?|[oa]\d+(?:/\d+)+(?:\.\d+)?)|g(?:[er]-?\d+(?:/\d+)*(?:\.\d+)?|igabitethernet\s?\d+(?:/\d+)*(?:\.\d+)?|[ie]\d+(?:/\d+)+(?:\.\d+)?)|hu(?:ndredgig(?:abit)?(?:ethernet|e)?\s?\d+(?:/\d+)*(?:\.\d+)?|\d+(?:/\d+)+(?:\.\d+)?)|irb(?:-?\d+(?:/\d+)*)?(?:\.\d+)?|lo(?:-?\d+(?:/\d+)*(?:\.\d+)?|opback\s?\d+)|m(?:g?e-?\d+(?:/\d+)*(?:\.\d+)?|ge\d+(?:/\d+)+(?:\.\d+)?|eth\d+(?:/\d+)+|gmt\d+|anagement\d+|obile\d*)|p(?:s-?\d+(?:/\d+)*(?:\.\d+)?|ort-channel\s?\d+|o\d+|hy-eth\s?\d+(?:/\d+)+)|nve\d+|reth\d+(?:\.\d+)?|st-?\d+(?:/\d+)*(?:\.\d+)?|t(?:(?:en|wenty ?five)gig(?:abit)?(?:ethernet|e)?\s?\d+(?:/\d+)*(?:\.\d+)?|we?\d+(?:/\d+)+(?:\.\d+)?|e\d+(?:/\d+)+(?:\.\d+)?|unnel\d+|runk\s+\d+|un\d+|ap\d+)|v(?:l\d+|lanif\s?\d+|lan\s?\d+|mbr\d+|eth\w+)|w(?:g|wan)\d+|x(?:e-?\d+(?:/\d+)*(?:\.\d+)?|x?gigabitethernet\s?\d+(?:/\d+)*(?:\.\d+)?|ge?\d+(?:/\d+)+(?:\.\d+)?))\b
  color: f.yellow bold

- description: Puertos Nokia SR-OS (1/1/1 · 1/1/c1/1 · esat-1/1/1 · lag-10)
  regex: (?i)\besat-\d{1,2}/\d{1,2}/\d{1,3}\b|(?<![\d/])\d{1,2}/\d{1,2}/(?:c\d{1,2}(?:/\d{1,3})?|\d{1,3})(?![\d/])|\b(?:lag|pxc)-\d+(?:\.[ab])?\b
  color: f.yellow bold

# ── PROTOCOLOS / ROUTING ────────────────────────────────────────────────────
- description: Protocolos
  regex: \b(BGP|OSPF|OSPFv3|ISIS|IS-IS|LDP|RSVP|MPLS|SR|SRv6|LACP|LLDP|CDP|BFD|VRRP|HSRP|STP|RSTP|MSTP|EVPN|VXLAN|VPLS|L2VPN|L3VPN|VRF|PIM|IGMP|NTP|SNMP|SSH|TACACS\+?|RADIUS|DHCP|DNS|ARP|ND|ICMP|TCP|UDP|GRE|IPsec|NAT)\b|\bvpn-instance\b|\brouting-instance\b
  color: f.blue bold
- description: Campos de estado Nokia (Admin State · Oper State)
  regex: \b(Admin|Oper(ational)?) (State|Status)\b
  color: f.blue
- description: AS
  regex: (?i)\b(AS|asn?)\s?(:\s?)?\d{1,10}\b|\b(local|peer) AS\s*:\s*\d{1,10}\b|\bautonomous system\s*:\s*\d{1,10}\b
  color: f.blue

# ── SERVIDORES ──────────────────────────────────────────────────────────────
- description: Uso alto (disco, CPU, memoria)
  regex: \b(9\d|100)(\.\d+)?%
  color: f.red bold
- description: Uso medio
  regex: \b[78]\d(\.\d+)?%
  color: f.orange bold
- description: Usuario root
  regex: \broot\b
  color: f.magenta bold
- description: Rutas de ficheros
  regex: (?<![\w.:/-])(~|/)[\w.@-]+(/[\w.@-]+)+/?
  color: f.blue
- description: Tiempo encendido (1y2w, 3w2d, 2d04h)
  regex: \b\d+y\d+w\b|\b\d+w\d+d\b|\b\d+d\d+h\b
  color: f.dim
- description: Fechas y horas
  regex: \b\d{4}/\d\d/\d\d\b|\b\d{4}-\d\d-\d\d([ T]\d\d:\d\d(:\d\d)?(\.\d+)?(Z|[+-]\d\d:?\d\d)?)?\b|\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+\d\d:\d\d:\d\d\b|\b\d\d:\d\d:\d\d\b
  color: f.dim

# ── DESCRIPCIONES TÍPICAS ───────────────────────────────────────────────────
- description: ADM / reservado
  regex: \b(ADM|RESERVADO|LIBRE|FREE|UNUSED)\b
  color: f.dim
